spring.application.name=risk-monitor-backend

spring.datasource.url=jdbc:postgresql://localhost:5433/risk_monitor
spring.datasource.username=dev_user
spring.datasource.password=dev_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

risk-monitor.system.user=system

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

# AUDIT LOG TOGGLE
risk-monitor.audit.enabled=true

# DEMO DATA TOGGLE
riskmonitor.seed.enabled=true

# `highCount` or `average` STRATEGU
riskmonitor.risk.sort-strategy=highCount

# fake delay (ms) on async report generation so PENDING is visible. 0 = off
riskmonitor.reports.simulated-delay-ms=4000

services:
  postgres:
    image: postgres:16
    container_name: risk-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: risk_monitor
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - psk-network

  authserver:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: risk-monitor-authserver
    restart: unless-stopped
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/auth/callback}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174,http://frontend:5173}
      AUTH_PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - psk-network

  backend:
    build:
      context: ./backend
    container_name: risk-monitor-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/risk_monitor
      SPRING_DATASOURCE_USERNAME: dev_user
      SPRING_DATASOURCE_PASSWORD: dev_password
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    networks:
      - psk-network

  frontend:
    build:
      context: ./frontend
    container_name: risk-monitor-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - authserver
    environment:
      VITE_API_PROXY_TARGET: http://backend:8081
      VITE_AUTH_URL: ${VITE_AUTH_URL:-http://localhost:3000}
    ports:
      - "5173:5173"
    networks:
      - psk-network

volumes:
  postgres_data:

networks:
  psk-network:
    driver: bridge

